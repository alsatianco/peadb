name: Nightly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake g++ liblua5.1-0-dev redis-server tcl

      - name: Prepare Redis 7.2.5 reference
        run: bash scripts/ci/ensure_redis_reference.sh

      - name: Configure (ASAN+UBSAN)
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-O1 -fsanitize=address,undefined -fno-omit-frame-pointer"

      - name: Build
        run: cmake --build build-asan -j$(nproc)

      - name: Unit tests (ASAN)
        run: cd build-asan && ctest --output-on-failure

      - name: Integration smoke (ASAN)
        env:
          PEADB_TEST_SANITIZED: "1"
          TIMEOUT_SECS: "90"
        run: cd build-asan && ../scripts/ci/run_integration_tests.sh

  stability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake g++ liblua5.1-0-dev redis-server tcl

      - name: Prepare Redis 7.2.5 reference
        run: bash scripts/ci/ensure_redis_reference.sh

      - name: Configure (Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Full integration suite
        run: cd build && ../scripts/ci/run_integration_tests.sh

      - name: Redis upstream compatibility tests
        env:
          SUITE_MODE: native
          OUT_DIR: artifacts/redis-native
        # Run tests/test_helper.tcl with the native harness and the adopted
        # suites/skipfiles tracked in compat/redis_suite_ledger.json. Native mode
        # lets each test configure and restart its own PeaDB server.
        #
        # `set -o pipefail` is required: the GitHub Actions default shell uses
        # `bash -e {0}`, which does NOT enable pipefail. Without it, a failing
        # `run_redis_tests.sh` on the left side of the `| tee` pipeline is
        # masked by tee's exit-0, hiding compat failures from CI.
        run: |
          set -o pipefail
          mkdir -p artifacts
          bash scripts/redis/run_redis_tests.sh 2>&1 | tee artifacts/redis-compat.log

      - name: Upstream suite ratchet
        run: |
          python3 scripts/redis/parse_tcl_results.py artifacts/redis-native \
            --out-json artifacts/redis-native/pass_rate.json
          python3 scripts/ci/check_suite_ratchet.py --results artifacts/redis-native/pass_rate.json

      - name: Compat scoreboard
        run: python3 scripts/ci/generate_compat_scoreboard.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-artifacts
          path: artifacts/
