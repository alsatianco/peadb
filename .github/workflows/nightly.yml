name: Nightly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake g++ liblua5.1-0-dev redis-server tcl

      - name: Configure (ASAN+UBSAN)
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"

      - name: Build
        run: cmake --build build-asan -j$(nproc)

      - name: Unit tests (ASAN)
        run: cd build-asan && ctest --output-on-failure

      - name: Integration smoke (ASAN)
        run: cd build-asan && ../scripts/ci/run_integration_tests.sh

  stability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake g++ liblua5.1-0-dev redis-server tcl

      - name: Configure (Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Full integration suite
        run: cd build && ../scripts/ci/run_integration_tests.sh

      - name: Compat scoreboard
        run: python3 scripts/ci/generate_compat_scoreboard.py

      - name: Redis upstream compatibility tests
        # Invokes scripts/redis/run_redis_tests.sh which runs the Redis Tcl suite
        # (tests/test_helper.tcl) against PeaDB. Failure is blocking: the curated
        # SUITES list in run_redis_tests.sh names only suites that must pass on
        # PeaDB. To explicitly waive a regression, remove or comment out the
        # offending suite there (and track it in compat/delta.md).
        run: |
          mkdir -p artifacts
          bash scripts/redis/run_redis_tests.sh 2>&1 | tee artifacts/redis-compat.log

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-artifacts
          path: artifacts/
