name: PR

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake g++ liblua5.1-0-dev redis-server python3-venv
          python3 -m venv "$RUNNER_TEMP/clang-format"
          "$RUNNER_TEMP/clang-format/bin/pip" install clang-format==18.1.8
          echo "$RUNNER_TEMP/clang-format/bin" >> "$GITHUB_PATH"

      - name: clang-format check
        run: |
          find src include -type f \( -name '*.cpp' -o -name '*.hpp' -o -name '*.c' -o -name '*.h' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

      - name: Prepare Redis 7.2.5 reference
        run: bash scripts/ci/ensure_redis_reference.sh

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Unit tests
        run: cd build && ctest --output-on-failure

      - name: Integration smoke
        run: cd build && ../scripts/ci/run_integration_tests.sh

      - name: Command coverage gate
        run: python3 scripts/ci/check_command_test_coverage.py

      - name: Integration test port collision check
        run: python3 scripts/ci/check_port_collisions.py

      - name: Compat delta check
        run: |
          if [ -f scripts/ci/check_compat_delta.py ]; then
            python3 scripts/ci/check_compat_delta.py
          fi

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr-failure-logs
          path: |
            artifacts/integration/
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
